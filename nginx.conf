# ==============================================================================
#           FINORA / TÍCH SẢN — NGINX 3 CỔNG RIÊNG BIỆT CHO 3 SUBDOMAIN
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CỔNG 7001: DÀNH RIÊNG CHO LANDING PAGE (tichsan.site & www.tichsan.site)
# Cloudflare Tunnel trỏ: tichsan.site -> localhost:7001
# ------------------------------------------------------------------------------
server {
    listen 7001;
    server_name tichsan.site www.tichsan.site localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cấu hình tải file Android APK cho Landing Page
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Finora-TichSan.apk"';
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Không cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static assets cache
    location ~* \.(?:ico|png|jpg|jpeg|svg|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Cổng 7001 phục vụ SPA (React Router tự render Landing Page tại root /)
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 2. CỔNG 7000: DÀNH RIÊNG CHO ỨNG DỤNG CHÍNH (app.tichsan.site)
# Cloudflare Tunnel trỏ: app.tichsan.site -> localhost:7000
# ------------------------------------------------------------------------------
