# ------------------------------------------------------------------------------
# 4. CỔNG 80: DỰ PHÒNG & TƯƠNG THÍCH MẠNG NỘI BỘ DOCKER (HTTP DEFAULT)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name app.tichsan.site auth.tichsan.site tichsan.site www.tichsan.site localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Finora-TichSan.apk"';
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(?:ico|png|jpg|jpeg|svg|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
