server {
    listen 80;
    listen 7002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Inject auth mode into HTML
    sub_filter '<head>' '<head><script>window.__FINORA_MODE__="auth";</script>';
    sub_filter_once on;
    sub_filter_types text/html;

    # Reverse proxy API requests to finora-api container
    location /api/ {
        proxy_pass http://finora-api:7003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static assets cache
    location ~* \.(?:ico|png|jpg|jpeg|svg|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
